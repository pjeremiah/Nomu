# Render Blueprint – Nomu web frontend (static site)
# Deploys the React app and serves the mobile APK from /Nomu-Mobile-Application.apk
# Auto-deploy: on by default when you push to the connected branch

services:
  - type: web
    name: nomu-frontend
    runtime: static
    rootDir: 01-web-application/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    branch: main
